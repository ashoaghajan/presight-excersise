# `docker compose up --build` brings up the API and the static client.
#
# Both images build from the repository root because the `@presight/shared`
# workspace is a build-time dependency of each.
#
# Published host ports are overridable, because 4000 and 8080 are popular and a
# collision is confusing to diagnose — the container binds fine and only the
# host side is shadowed. Put CLIENT_PORT / SERVER_PORT in a `.env` beside this
# file, or pass them inline:
#
#   CLIENT_PORT=9090 SERVER_PORT=4100 docker compose up --build
#
# Only the host side moves; nothing inside the network changes.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      # Points at the named volume so the seeded database survives rebuilds.
      DATABASE_PATH: /data/app.sqlite
      # The browser reaches the API through nginx on the same origin, so no
      # cross-origin request is expected; kept explicit for direct API access.
      CORS_ORIGIN: http://localhost:${CLIENT_PORT:-8080}
      LOG_LEVEL: info
    volumes:
      - sqlite-data:/data
    # Seed before serving. The seeder migrates first and skips a database that
    # already has users, so restarts are both safe and cheap. (The server also
    # migrates on boot; this only adds the demo data.)
    command: ['sh', '-c', 'node dist/db/seed/cli.js && node dist/index.js']
    ports:
      - '${SERVER_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '${CLIENT_PORT:-8080}:80'
    # nginx proxies /api to the server, so starting before the API is reachable
    # would serve a page whose first request fails.
    depends_on:
      server:
        condition: service_healthy

volumes:
  # Named volume, not a bind mount: the database file is container-owned state,
  # and a bind mount would write it into the working tree as root.
  sqlite-data:
