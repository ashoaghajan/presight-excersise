server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: the view state lives in the query string of `/`, but any
  # deep link must still boot the app instead of 404ing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html names the hashed bundles, so a cached copy can outlive the files
  # it points at and boot a build whose assets are gone. Without an explicit
  # header nginx sends none, and browsers fall back to heuristic caching off
  # Last-Modified — must be spelled out.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same-origin API. `server` is the compose service name.
  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed asset filenames are immutable — a changed file gets a new name, so
  # it can be cached indefinitely. One header, not `expires` + `add_header`,
  # which emits two conflicting Cache-Control lines.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
